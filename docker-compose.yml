services:

  api:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    command: >
      sh -c "
      until pg_isready -h postgres -p 5432; do
        echo 'Waiting for Postgres...';
        sleep 2;
      done;
      npx prisma migrate deploy;
      node src/server.js
      "

  worker:
    build: .
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    command: >
      sh -c "
      until pg_isready -h postgres -p 5432; do
        echo 'Waiting for Postgres...';
        sleep 2;
      done;
      node src/workers/audit.workers.js
      "

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: realtime_tasks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: